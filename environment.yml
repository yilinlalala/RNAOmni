# Conda environment for RNAOmni (demo / onehot path).
#   conda env create -f environment.yml
#   conda activate rnaomni
#
# Install a CUDA build of PyTorch that matches your driver, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Optional: ViennaRNA (struct_*), mmseqs (classification splits),
# transformers + flash_attn (evo / evo2).

name: rnaomni
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2
  - pyyaml>=6
  - pandas>=2
  - scipy>=1.10
  - pip:
      - torch
